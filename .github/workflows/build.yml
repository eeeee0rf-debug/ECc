name: EC CS2 Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Merge parts & extract
      shell: pwsh
      run: |
        $p1 = [IO.File]::ReadAllBytes("part1.zip")
        $p2 = [IO.File]::ReadAllBytes("part2.zip")
        [IO.File]::WriteAllBytes("EC-CS2-fixed.zip", ($p1 + $p2))
        Expand-Archive -Path "EC-CS2-fixed.zip" -DestinationPath "." -Force
        if (-not (Test-Path "EC-CS2.sln")) {
          Write-Error "EC-CS2.sln not found"
          exit 1
        }

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install ATL
      shell: pwsh
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -property installationPath
        $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
        & $installer modify `
          --installPath $vsPath `
          --add Microsoft.VisualStudio.Component.VC.ATL `
          --quiet --norestart --force

    - name: Build Release x64
      shell: pwsh
      run: |
        msbuild "EC-CS2.sln" `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /m `
          /nologo `
          /verbosity:minimal

    - name: Collect output
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "output" | Out-Null

        # DLL — مسیر دقیق
        if (Test-Path "x64\Release\EC-CS2-DLL.dll") {
          Copy-Item "x64\Release\EC-CS2-DLL.dll" "output\"
        }

        # Injector EXE — مسیر دقیق
        if (Test-Path "x64\Release\EC-CS2.exe") {
          Copy-Item "x64\Release\EC-CS2.exe" "output\EC-Injector.exe"
        }

        Write-Host "--- output contents ---"
        Get-ChildItem "output\"

        if (-not (Test-Path "output\EC-CS2-DLL.dll")) {
          Write-Error "EC-CS2-DLL.dll missing — build failed"
          exit 1
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: EC-CS2-${{ github.sha }}
        path: output/
        retention-days: 30
