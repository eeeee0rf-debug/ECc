name: EC CS2 Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Merge parts & extract
      shell: pwsh
      run: |
        $p1 = [IO.File]::ReadAllBytes("part1.zip")
        $p2 = [IO.File]::ReadAllBytes("part2.zip")
        [IO.File]::WriteAllBytes("EC-CS2-fixed.zip", ($p1 + $p2))
        Expand-Archive -Path "EC-CS2-fixed.zip" -DestinationPath "." -Force

        if (-not (Test-Path "EC-CS2.sln")) {
          Write-Error "EC-CS2.sln not found — zip structure mismatch"
          exit 1
        }

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Release x64
      shell: pwsh
      run: |
        msbuild "EC-CS2.sln" `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /m `
          /nologo `
          /verbosity:minimal

    - name: Collect output
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "output" | Out-Null

        Get-ChildItem -Recurse -Filter "EC-CS2-DLL.dll" |
          Where-Object { $_.FullName -match "Release" } |
          Copy-Item -Destination "output\" -ErrorAction SilentlyContinue

        Get-ChildItem -Recurse -Filter "EC-CS2.exe" |
          Where-Object { $_.FullName -match "Release" } |
          Copy-Item -Destination "output\EC-Injector.exe" -ErrorAction SilentlyContinue

        Write-Host "--- output contents ---"
        Get-ChildItem "output\"

        if ((Get-ChildItem "output\").Count -eq 0) {
          Write-Error "No output files — build may have silently failed"
          exit 1
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: EC-CS2-${{ github.sha }}
        path: output/
        retention-days: 30
